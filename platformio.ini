; ============================================================================
; platformio.ini - 构建配置（esp32-s3-devkitc-1 / ESP-IDF / LVGL 8.3）
;
; 关键配置说明与可调整内容：
;   - board_build.partitions = partitions.csv：分区表（见该文件注释），
;     改动后需整片擦除重烧。
;   - extra_scripts = pre:tools/gen_fonts.py：每次构建前重新生成内嵌
;     字库（内容未变会跳过；依赖 node + npm 全局 lv_font_conv）。
;     SD 卡中文字库用 tools/gen_sd_fonts.py 手动生成（输出 assets/sd_fonts/，
;     拷到 SD 卡 /fonts/ 即可，不参与构建）。
;   - -O1：全局优化降级（gcc12.2 对 esp_lcd_panel_rgb.c 有编译器内部
;     错误 ICE）。若升级工具链可尝试恢复 -O2（更快更小）。
;   - LV_CONF_PATH：强制使用本项目 include/lv_conf.h（颜色格式/内存
;     策略/字体裁剪都在那配，别删此宏）；路径依赖下方的 -I include。
;   - lvgl@^8.3.0：LVGL 大版本别升（8→9 API 全面断裂）。
;   - monitor_dtr/rts=0：防止打开监视器时自动复位板子。
; ============================================================================
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform=espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv     ; N16R8 16MB flash 自定义分区表（单 app 大分区）
monitor_speed = 115200
monitor_raw = yes
monitor_dtr = 0
monitor_rts = 0
extra_scripts = 
    pre:tools/gen_fonts.py

build_flags =
    -O1                                   ; 降级优化避免 gcc12.2 对 esp_lcd_panel_rgb.c 的 ICE（RGB驱动未使用）
    -D LV_CONF_INCLUDE_SIMPLE             ; 使用简单的头文件包含逻辑
    -D LV_CONF_PATH="lv_conf.h"           ; 强制使用项目自带的 lv_conf.h（配合 -I include）
    -I include                            ; 允许包含项目根目录下的 include 文件夹
    -I src/bsp
    -I src/ui
    -I src/mjpeg_player

lib_deps = 
    lvgl/lvgl@^8.3.0